[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shuttlecut"
version = "1.0.0"
description = "Badminton rally auto-clipping: motion-compensated temporal pipeline with zero-training inference"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "scipy>=1.14",
    "matplotlib>=3.8",
    "librosa>=1.0",
    "soundfile>=0.12",
    "torch>=2.9",
    "torchvision>=0.24",
    "pytorchvideo>=0.1.5",
]

[project.scripts]
shuttlecut = "shuttlecut.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shuttlecut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
